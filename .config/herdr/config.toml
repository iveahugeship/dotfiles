onboarding = false

[ui]
copy_on_select = false
confirm_close = false

pane_outer_borders = false
pane_gaps = false

prompt_new_tab_name = false
prompt_new_workspace_name = false

sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

tab_bar_position = "bottom"
tab_bar_right = [
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = "|"

[keys]
toggle_sidebar = ["prefix+ctrl+h", "prefix+ctrl+р"]

reload_config = ["prefix+,", "prefix+б"]
detach = ["prefix+d", "prefix+в"]
goto = ["prefix+s", "prefix+ы"]

new_workspace = ["prefix+shift+t", "prefix+shift+е"]
close_workspace = ["prefix+shift+w", "prefix+shift+ц"]
workspace_picker = ["prefix+shift+s", "prefix+shift+ы"]

new_tab = ["prefix+ctrl+t", "prefix+ctrl+е"]
close_tab = ["prefix+ctrl+w", "prefix+ctrl+ц"]

split_vertical = ["prefix+g", "prefix+п"]
split_horizontal = ["prefix+v", "prefix+м"]
close_pane = ["prefix+w", "prefix+ц"]
zoom = ["prefix+f", "prefix+а"]
resize_mode = ["prefix+r", "prefix+к"]

[[keys.command]]
key = "prefix+q"
type = "shell"
command = "herdr server stop"
description = "stop server"

[[keys.command]]
key = "prefix+й"
type = "shell"
command = "herdr server stop"
description = "stop server"

[[keys.command]]
key = "prefix+k"
type = "shell"
command = '''
id=$(herdr tab list | jq -r 'first(.result.tabs[] | select(.label == "kubernetes") | .tab_id) // empty')
if [ -n "$id" ]; then
  herdr tab focus "$id"
else
  pane=$(herdr tab create --label kubernetes --focus | jq -r .result.root_pane.pane_id)
  herdr pane run "$pane" 'sofka; herdr tab close "$HERDR_TAB_ID"'
fi
'''
description = "sofka: open in new tab"

[[keys.command]]
key = "prefix+л"
type = "shell"
command = '''
id=$(herdr tab list | jq -r 'first(.result.tabs[] | select(.label == "kubernetes") | .tab_id) // empty')
if [ -n "$id" ]; then
  herdr tab focus "$id"
else
  pane=$(herdr tab create --label kubernetes --focus | jq -r .result.root_pane.pane_id)
  herdr pane run "$pane" 'sofka; herdr tab close "$HERDR_TAB_ID"'
fi
'''
description = "sofka: open in new tab"

[[keys.command]]
key = "prefix+z"
type = "plugin_action"
command = "furkankly.zoetrope.open-split"
description = "zoetrope: session graph (split)"

[[keys.command]]
key = "prefix+я"
type = "plugin_action"
command = "furkankly.zoetrope.open-split"
description = "zoetrope: session graph (split)"
